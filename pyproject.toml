[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdb"
version = "0.1.0"
description = "Herramienta de bug bounty para Bugcrowd: control de scope, VRT y seguimiento de hallazgos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hdb = "hdb.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hdb = ["data/*.json"]
